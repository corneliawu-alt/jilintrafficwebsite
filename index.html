
<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>吉林吉安，守護交安，心安平安</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --clay-bg: #fdfaf6;
        --clay-primary: #ffb5a7;
        --clay-secondary: #b9fbc0;
        --clay-accent: #a0c4ff;
        --clay-text: #4a4e69;
        --clay-shadow: rgba(0, 0, 0, 0.08);
      }
      
      body {
        font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
        background-color: var(--clay-bg);
        color: var(--clay-text);
        margin: 0;
        overflow-x: hidden;
      }

      /* Background image for safety promotion page */
      .safety-promotion-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('/data/吉林國小大門照片.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.3;
        z-index: 1;
        pointer-events: none;
      }

      /* Advanced Claymorphism Effect */
      .clay-card {
        background: #ffffff;
        border-radius: 48px;
        box-shadow: 
          16px 16px 32px rgba(0, 0, 0, 0.05),
          -16px -16px 32px rgba(255, 255, 255, 0.8),
          inset 8px 8px 16px rgba(255, 255, 255, 0.9),
          inset -8px -8px 16px rgba(0, 0, 0, 0.02);
        border: 4px solid #ffffff;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .clay-card:hover {
        transform: translateY(-8px);
        box-shadow: 
          24px 24px 48px rgba(0, 0, 0, 0.08),
          -24px -24px 48px rgba(255, 255, 255, 0.9),
          inset 10px 10px 20px rgba(255, 255, 255, 1),
          inset -10px -10px 20px rgba(0, 0, 0, 0.03);
      }

      .clay-button {
        border-radius: 60px;
        box-shadow: 
          8px 8px 16px rgba(0, 0, 0, 0.05),
          -8px -8px 16px rgba(255, 255, 255, 0.8),
          inset 4px 4px 8px rgba(255, 255, 255, 0.6),
          inset -4px -4px 8px rgba(0, 0, 0, 0.04);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .clay-button:hover {
        transform: scale(1.05);
      }

      .clay-button:active {
        transform: scale(0.92);
        box-shadow: 
          inset 8px 8px 16px rgba(0, 0, 0, 0.1),
          inset -8px -8px 16px rgba(255, 255, 255, 0.5);
      }

      /* 3D Isometric Float Animations */
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-25px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      @keyframes drift {
        0% { transform: translateX(0px); }
        50% { transform: translateX(30px); }
        100% { transform: translateX(0px); }
      }

      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-float-slow { animation: float 10s ease-in-out infinite; }
      .animate-drift { animation: drift 8s ease-in-out infinite; }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 30px;
        border: 4px solid var(--clay-bg);
      }

      /* Soft Toy Textures */
      .toy-texture {
        background-image: radial-gradient(circle at 2px 2px, rgba(0,0,0,0.01) 1px, transparent 0);
        background-size: 20px 20px;
      }

      /* Background image for org-plan page */
      .org-plan-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('/data/1-0-0.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.3;
        z-index: 1;
        pointer-events: none;
      }

      /* Background image for teaching page */
      .teaching-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('/data/2-0-0.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.3;
        z-index: 1;
        pointer-events: none;
      }

      /* Background image for guidance page */
      .guidance-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('/data/3-0-0.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.3;
        z-index: 1;
        pointer-events: none;
      }

      /* Background image for innovation page */
      .innovation-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('/data/4-0-0.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.5;
        z-index: 1;
        pointer-events: none;
      }
    </style>
</head>
  <body class="toy-texture">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* 背景與道路顏色 */
      .bg-grass { fill: #A8D5BA; }
      .road { fill: #555555; }
      .marking-white { fill: #FFFFFF; }
      .marking-yellow { fill: #FFD700; }
      .red-line { stroke: #FF3333; stroke-width: 8; stroke-linecap: round; }
      
      /* 對話框：預設隱藏，點擊標線後由 JS 顯示 */
      .box { display: none; transform-origin: center; }
      .box.active { display: block; }
      
      /* 可點擊的交通標線熱區 */
      .trigger { fill: transparent; cursor: pointer; }
      .trigger:hover { fill: rgba(255,255,255,0.15); }
      
      /* 文字與框線樣式（字級配合框線，避免溢出） */
      .bubble-bg { fill: #FFFFFF; stroke-width: 4; rx: 15; filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.2)); }
      .bubble-title { font-size: 14px; font-weight: bold; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
      .bubble-text { font-size: 12px; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; fill: #444444; }
      .pointer { fill: #FFFFFF; stroke-width: 3; }
      
      /* 裝飾物 */
      .tree-top { fill: #4CAF50; }
      .tree-trunk { fill: #795548; }
      
      /* 紅綠燈、小綠人 */
      .traffic-light-pole { fill: #37474F; }
      .traffic-light-box { fill: #263238; stroke: #455A64; stroke-width: 2; }
      .light-red { fill: #E53935; }
      .light-red.off { fill: #5D4037; }
      .light-yellow { fill: #FDD835; }
      .light-yellow.off { fill: #5D4037; }
      .light-green { fill: #43A047; }
      .light-green.off { fill: #2E7D32; }
      .pedestrian-box { fill: #263238; stroke: #455A64; stroke-width: 2; }
      .pedestrian-red { fill: #E53935; }
      .pedestrian-red.off { fill: #5D4037; }
      .pedestrian-green { fill: #43A047; }
    </style>
  </defs>

  <rect class="bg-grass" width="800" height="600"/>
  
  <rect class="road" x="300" y="0" width="200" height="600"/>
  <rect class="road" x="0" y="200" width="800" height="200"/>
  <path d="M 300 0 L 300 200 L 0 200" fill="none" stroke="#DDDDDD" stroke-width="2"/>
  <path d="M 500 0 L 500 200 L 800 200" fill="none" stroke="#DDDDDD" stroke-width="2"/>
  <path d="M 0 400 L 300 400 L 300 600" fill="none" stroke="#DDDDDD" stroke-width="2"/>
  <path d="M 800 400 L 500 400 L 500 600" fill="none" stroke="#DDDDDD" stroke-width="2"/>

  <g transform="translate(150, 80)">
    <rect class="tree-trunk" x="-5" y="0" width="10" height="40"/>
    <circle class="tree-top" cx="0" cy="0" r="30"/>
    <circle class="tree-top" cx="-15" cy="-15" r="20"/>
    <circle class="tree-top" cx="15" cy="-15" r="20"/>
  </g>
  <g transform="translate(650, 500)">
    <rect class="tree-trunk" x="-5" y="0" width="10" height="40"/>
    <circle class="tree-top" cx="0" cy="0" r="30"/>
    <circle class="tree-top" cx="-15" cy="-15" r="20"/>
    <circle class="tree-top" cx="15" cy="-15" r="20"/>
  </g>

  <!-- 網狀線（路口中央，下緣留空隙不與彩色行人穿越道重疊） -->
  <g transform="translate(305, 205)">
    <path d="M 0 0 L 190 0 L 190 180 L 0 180 Z" stroke="#FFD700" stroke-width="4" fill="none"/>
    <path d="M 0 0 L 190 180 M 190 0 L 0 180 M 95 0 L 190 90 M 95 0 L 0 90 M 0 90 L 95 180 M 190 90 L 95 180" stroke="#FFD700" stroke-width="4"/>
  </g>

  <g transform="translate(320, 140)">
    <rect class="marking-white" x="0" y="0" width="20" height="55"/>
    <rect class="marking-white" x="35" y="0" width="20" height="55"/>
    <rect class="marking-white" x="70" y="0" width="20" height="55"/>
    <rect class="marking-white" x="105" y="0" width="20" height="55"/>
    <rect class="marking-white" x="140" y="0" width="20" height="55"/>
  </g>

  <g transform="translate(320, 405)">
    <!-- 彩色行人穿越道線：黃色棋盤格與白色柱狀錯位排列，不可完全對齊 -->
    <rect class="marking-yellow" x="-10" y="-15" width="20" height="15"/>
    <rect class="marking-yellow" x="25" y="-15" width="20" height="15"/>
    <rect class="marking-yellow" x="60" y="-15" width="20" height="15"/>
    <rect class="marking-yellow" x="95" y="-15" width="20" height="15"/>
    <rect class="marking-yellow" x="130" y="-15" width="20" height="15"/>
    
    <rect class="marking-yellow" x="-10" y="55" width="20" height="15"/>
    <rect class="marking-yellow" x="25" y="55" width="20" height="15"/>
    <rect class="marking-yellow" x="60" y="55" width="20" height="15"/>
    <rect class="marking-yellow" x="95" y="55" width="20" height="15"/>
    <rect class="marking-yellow" x="130" y="55" width="20" height="15"/>
    
    <rect class="marking-white" x="0" y="0" width="20" height="55"/>
    <rect class="marking-white" x="35" y="0" width="20" height="55"/>
    <rect class="marking-white" x="70" y="0" width="20" height="55"/>
    <rect class="marking-white" x="105" y="0" width="20" height="55"/>
    <rect class="marking-white" x="140" y="0" width="20" height="55"/>
  </g>

  <!-- 東西向左側彩色道：在停止線右側、網狀線左側（停止線僅下段在左） -->
  <g transform="translate(230, 228)">
    <!-- 左側黃格（原下排，旋轉後在左） -->
    <rect class="marking-yellow" x="-15" y="-10" width="15" height="20"/>
    <rect class="marking-yellow" x="-15" y="25" width="15" height="20"/>
    <rect class="marking-yellow" x="-15" y="60" width="15" height="20"/>
    <rect class="marking-yellow" x="-15" y="95" width="15" height="20"/>
    <rect class="marking-yellow" x="-15" y="130" width="15" height="20"/>
    <!-- 右側黃格（原上排，旋轉後在右） -->
    <rect class="marking-yellow" x="55" y="-10" width="15" height="20"/>
    <rect class="marking-yellow" x="55" y="25" width="15" height="20"/>
    <rect class="marking-yellow" x="55" y="60" width="15" height="20"/>
    <rect class="marking-yellow" x="55" y="95" width="15" height="20"/>
    <rect class="marking-yellow" x="55" y="130" width="15" height="20"/>
    <!-- 五條白色橫條（原 20×55 柱右轉後 55×20），柱距 35 -->
    <rect class="marking-white" x="0" y="0" width="55" height="20"/>
    <rect class="marking-white" x="0" y="35" width="55" height="20"/>
    <rect class="marking-white" x="0" y="70" width="55" height="20"/>
    <rect class="marking-white" x="0" y="105" width="55" height="20"/>
    <rect class="marking-white" x="0" y="140" width="55" height="20"/>
  </g>
  <!-- 東西向右側斑馬線：每條白條 55×20（與北向單條 20×55 長寬對應），條距35，方向仍為橫條 -->
  <g transform="translate(508, 220)">
    <rect class="marking-white" x="0" y="0" width="55" height="20"/>
    <rect class="marking-white" x="0" y="35" width="55" height="20"/>
    <rect class="marking-white" x="0" y="70" width="55" height="20"/>
    <rect class="marking-white" x="0" y="105" width="55" height="20"/>
    <rect class="marking-white" x="0" y="140" width="55" height="20"/>
  </g>

  <path class="red-line" d="M 0 395 L 295 395 L 295 600"/>
  <path stroke="#FFCC00" stroke-width="8" stroke-linecap="round" fill="none" d="M 505 0 L 505 195 L 800 195"/>

  <!-- 分向限制線：雙黃實線（縱向；左上方：頂端與停止線下緣切齊 y=136→路徑138；右下方：上緣與停止線切齊 y=482→路徑484） -->
  <path stroke="#FFD700" stroke-width="4" fill="none" d="M 397 0 L 397 138 M 397 484 L 397 600"/>
  <path stroke="#FFD700" stroke-width="4" fill="none" d="M 403 0 L 403 138 M 403 484 L 403 600"/>
  <!-- 分向限制線：雙黃實線（橫向；路口穿越道與網狀線下方區域不劃設） -->
  <path stroke="#FFD700" stroke-width="4" fill="none" d="M 0 297 L 208 297 M 572 297 L 800 297"/>
  <path stroke="#FFD700" stroke-width="4" fill="none" d="M 0 303 L 208 303 M 572 303 L 800 303"/>
  <!-- 縱向白虛線：網狀線範圍內（含左右菱形區）完全不劃設 -->
  <path stroke="#FFFFFF" stroke-width="3" fill="none" stroke-dasharray="12 16" d="M 350 0 L 350 138 M 350 484 L 350 600"/>
  <path stroke="#FFFFFF" stroke-width="3" fill="none" stroke-dasharray="12 16" d="M 450 0 L 450 138 M 450 484 L 450 600"/>
  <!-- 車道線：白虛線（橫向；路口區不劃設） -->
  <path stroke="#FFFFFF" stroke-width="3" fill="none" stroke-dasharray="12 16" d="M 0 250 L 208 250 M 588 250 L 800 250"/>
  <path stroke="#FFFFFF" stroke-width="3" fill="none" stroke-dasharray="12 16" d="M 0 350 L 208 350 M 588 350 L 800 350"/>

  <!-- 車輛停止線：南北向 -->
  <path stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" d="M 300 133 L 390 133"/>
  <path stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" d="M 410 485 L 500 485"/>
  <!-- 西向直向停止線：自雙黃下緣至紅線（草坪上緣），不伸入草坪 -->
  <path stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" d="M 205 306 L 205 392"/>
  <!-- 東向斑馬線右側：南北向停止線（草坪下緣 y=200 至雙黃上緣 y=297） -->
  <path stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" d="M 572 200 L 572 297"/>
  <!-- 小綠人燈號（人行道位置，斑馬線旁） -->
  <g id="pedestrian-light" transform="translate(248, 118)">
    <rect class="pedestrian-box" x="0" y="0" width="44" height="72" rx="4"/>
    <!-- 上半部：紅燈小人（稍微放大） -->
    <g class="pedestrian-red">
      <circle cx="22" cy="11" r="6"/>
      <path d="M 22 17 L 22 27" stroke="#E53935" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M 22 19 L 16 27" stroke="#E53935" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M 22 19 L 28 27" stroke="#E53935" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M 22 27 L 17 36" stroke="#E53935" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M 22 27 L 27 36" stroke="#E53935" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    </g>
    <!-- 下半部：綠燈小人 -->
    <g class="pedestrian-green">
      <circle cx="22" cy="47" r="5"/>
      <path d="M 22 52 L 23 60" stroke="#43A047" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 23 55 L 30 59" stroke="#43A047" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 23 55 L 17 58" stroke="#43A047" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 23 60 L 30 67" stroke="#43A047" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 23 60 L 18 68" stroke="#43A047" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- 可點擊熱區：點到才顯示對應說明 -->
  <g id="triggers">
    <rect class="trigger" x="318" y="138" width="164" height="59" data-bubble="b1" title="行人穿越道線"/>
    <rect class="trigger" x="0" y="387" width="298" height="22" data-bubble="b2" title="紅線"/>
    <rect class="trigger" x="283" y="395" width="22" height="210" data-bubble="b2" title="紅線"/>
    <rect class="trigger" x="305" y="205" width="190" height="190" data-bubble="b4" title="網狀線"/>
    <rect class="trigger" x="310" y="390" width="185" height="90" data-bubble="b3" title="彩色行人穿越道線"/>
    <rect class="trigger" x="497" y="0" width="22" height="200" data-bubble="b5" title="黃線"/>
    <rect class="trigger" x="497" y="187" width="308" height="22" data-bubble="b5" title="黃線"/>
    <rect class="trigger" x="248" y="118" width="44" height="72" data-bubble="b7" title="小綠人"/>
    <rect class="trigger" x="394" y="0" width="14" height="200" data-bubble="b8" title="雙黃線"/>
    <rect class="trigger" x="394" y="400" width="14" height="200" data-bubble="b8" title="雙黃線"/>
    <rect class="trigger" x="0" y="294" width="208" height="14" data-bubble="b8" title="雙黃線"/>
    <rect class="trigger" x="588" y="294" width="212" height="14" data-bubble="b8" title="雙黃線"/>
    <rect class="trigger" x="342" y="0" width="18" height="138" data-bubble="b9" title="白虛線車道線"/>
    <rect class="trigger" x="442" y="0" width="18" height="138" data-bubble="b9" title="白虛線車道線"/>
    <rect class="trigger" x="342" y="484" width="18" height="116" data-bubble="b9" title="白虛線車道線"/>
    <rect class="trigger" x="442" y="484" width="18" height="116" data-bubble="b9" title="白虛線車道線"/>
    <rect class="trigger" x="0" y="242" width="208" height="18" data-bubble="b9" title="白虛線車道線"/>
    <rect class="trigger" x="588" y="242" width="212" height="18" data-bubble="b9" title="白虛線車道線"/>
    <rect class="trigger" x="0" y="342" width="208" height="18" data-bubble="b9" title="白虛線車道線"/>
    <rect class="trigger" x="588" y="342" width="212" height="18" data-bubble="b9" title="白虛線車道線"/>
    <rect class="trigger" x="300" y="128" width="90" height="12" data-bubble="b10" title="車輛停止線"/>
    <rect class="trigger" x="410" y="480" width="90" height="12" data-bubble="b10" title="車輛停止線"/>
    <rect class="trigger" x="213" y="216" width="107" height="175" data-bubble="b3" title="彩色行人穿越道線（西向）"/>
    <rect class="trigger" x="197" y="300" width="12" height="100" data-bubble="b10" title="車輛停止線（西向直向）"/>
    <rect class="trigger" x="500" y="212" width="70" height="155" data-bubble="b1" title="行人穿越道線（東向）"/>
    <rect class="trigger" x="564" y="193" width="14" height="112" data-bubble="b10" title="車輛停止線（東向直向）"/>
  </g>

  <g id="b1" class="box b1">
    <polygon points="260,110 330,165 280,130" class="pointer" stroke="#0099FF"/>
    <rect x="40" y="40" width="280" height="110" class="bubble-bg" stroke="#0099FF"/>
    <text x="52" y="75" class="bubble-title" fill="#0099FF">行人穿越道線 (斑馬線)</text>
    <text x="52" y="105" class="bubble-text">這是專屬行人的安全通道，</text>
    <text x="52" y="130" class="bubble-text">車輛靠近時必須減速禮讓喔！</text>
  </g>

  <g id="b2" class="box b2">
    <polygon points="260,490 280,410 230,480" class="pointer" stroke="#FF3333"/>
    <rect x="40" y="450" width="280" height="110" class="bubble-bg" stroke="#FF3333"/>
    <text x="52" y="485" class="bubble-title" fill="#FF3333">禁止臨時停車線（紅線）</text>
    <text x="52" y="515" class="bubble-text">任何時段都「完全禁止」停車與臨時停車，</text>
    <text x="52" y="540" class="bubble-text">連短暫停留都不可以，比黃線更嚴格。</text>
  </g>

  <g id="b3" class="box b3">
    <polygon points="530,490 440,450 540,460" class="pointer" stroke="#FF8C00"/>
    <rect x="510" y="450" width="270" height="110" class="bubble-bg" stroke="#FF8C00"/>
    <text x="522" y="485" class="bubble-title" fill="#FF8C00">彩色行人穿越道線</text>
    <text x="522" y="515" class="bubble-text">黃色棋盤格讓馬路更醒目，</text>
    <text x="522" y="540" class="bubble-text">強烈提醒司機叔叔開慢一點。</text>
  </g>

  <g id="b4" class="box b4">
    <polygon points="540,120 450,230 570,140" class="pointer" stroke="#CCCC00"/>
    <rect x="510" y="40" width="270" height="110" class="bubble-bg" stroke="#CCCC00"/>
    <text x="522" y="75" class="bubble-title" fill="#999900">網狀線 (黃色網格)</text>
    <text x="522" y="105" class="bubble-text">提醒車子「絕對不能停在裡面」</text>
    <text x="522" y="130" class="bubble-text">保持十字路口中間不會塞車！</text>
  </g>

  <g id="b5" class="box b5">
    <polygon points="515,95 505,85 505,105" class="pointer" stroke="#E6B800"/>
    <rect x="515" y="50" width="270" height="110" class="bubble-bg" stroke="#E6B800" rx="15"/>
    <text x="527" y="85" class="bubble-title" fill="#B8860B">禁止停車線（黃線）</text>
    <text x="527" y="115" class="bubble-text">禁止「長時間停車」，但可短暫臨時停車</text>
    <text x="527" y="140" class="bubble-text">（如上下客、卸貨），規定比紅線寬鬆。</text>
  </g>

  <g id="b7" class="box b7">
    <polygon points="318,154 332,142 332,166" class="pointer" stroke="#43A047"/>
    <rect x="332" y="40" width="280" height="100" class="bubble-bg" stroke="#43A047" rx="15"/>
    <text x="344" y="75" class="bubble-title" fill="#2E7D32">行人穿越道燈（小綠人）</text>
    <text x="344" y="105" class="bubble-text">綠燈小綠人：可以安全通過馬路。</text>
    <text x="344" y="130" class="bubble-text">紅燈站立人：禁止通行，請在路邊等候。</text>
  </g>

  <g id="b8" class="box b8">
    <polygon points="418,100 432,88 432,112" class="pointer" stroke="#B8860B"/>
    <rect x="432" y="50" width="260" height="100" class="bubble-bg" stroke="#B8860B" rx="15"/>
    <text x="444" y="85" class="bubble-title" fill="#8B6914">分向限制線（雙黃線）</text>
    <text x="444" y="110" class="bubble-text">兩條黃線標示車道中央，禁止跨越、超車，</text>
    <text x="444" y="135" class="bubble-text">用來分隔對向車流，保障行車安全。</text>
  </g>

  <g id="b9" class="box b9">
    <polygon points="590,360 610,348 610,372" class="pointer" stroke="#555555"/>
    <rect x="610" y="280" width="180" height="100" class="bubble-bg" stroke="#555555" rx="15"/>
    <text x="622" y="315" class="bubble-title" fill="#333333">車道線（白虛線）</text>
    <text x="622" y="340" class="bubble-text">劃設於同向車道之間，車輛得跨越變換車道。</text>
    <text x="622" y="365" class="bubble-text">依道路交通標誌標線號誌設置規則設置。</text>
  </g>

  <g id="b10" class="box b10">
    <polygon points="380,136 400,124 400,148" class="pointer" stroke="#555555"/>
    <rect x="40" y="100" width="280" height="100" class="bubble-bg" stroke="#555555" rx="15"/>
    <text x="52" y="135" class="bubble-title" fill="#333333">停止線（車輛停止線）</text>
    <text x="52" y="165" class="bubble-text">劃設於行人穿越道前，車輛須在線後停等，</text>
    <text x="52" y="190" class="bubble-text">不得超越，以保障行人安全通過。</text>
  </g>

  <script type="text/ecmascript"><![CDATA[
    (function(){
      var triggers = document.querySelectorAll('.trigger');
      var boxes = document.querySelectorAll('.box');
      function showBubble(id) {
        boxes.forEach(function(b){ b.classList.remove('active'); });
        var el = document.getElementById(id);
        if (el) el.classList.add('active');
      }
      triggers.forEach(function(t){
        t.addEventListener('click', function(e){
          e.stopPropagation();
          var id = this.getAttribute('data-bubble');
          var box = document.getElementById(id);
          if (box && box.classList.contains('active')) {
            box.classList.remove('active');
          } else {
            showBubble(id);
          }
        });
      });
      document.documentElement.addEventListener('click', function(){
        boxes.forEach(function(b){ b.classList.remove('active'); });
      });
    })();
  ]]></script>
  
</svg>